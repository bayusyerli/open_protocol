# Penyegaran harian modul harga komoditas — dari SP2KP ke kosakata, tanpa tangan.
#
# KENAPA HARIAN, DAN KENAPA HANYA SP2KP
# Modul harga berdiri di atas satu-satunya sumber harian pemerintah yang berlisensi terbuka
# (docs/16 bagian 1). Sumber harian yang hanya ditarik saat ada yang ingat menariknya bukan
# sumber harian: pada 25 Agustus 2026 angka terbaru di repositori ini bertanggal 21 Agustus,
# dan layar harga menampilkannya sebagai "per 21 Agustus" tanpa berbohong sedikit pun —
# sambil tetap salah menjawab pertanyaan yang ditanyakan orang, yaitu berapa harga sekarang.
#
# Yang TIDAK ikut di sini, dan sebabnya masing-masing:
#   - Delapan seri TBS provinsi. Penetapannya MINGGUAN, jadi menariknya harian tujuh kali
#     lebih sering daripada angkanya berubah. Dua di antaranya (Kaltim, Babel) lagi pula
#     lewat OCR yang bersandar pada biner Swift yang hanya terbangun di macOS.
#   - Bapanas dan PIHPS. Benih PRIVAT menurut docs/16 bagian 2 — ditarik untuk menghitung,
#     tidak diterbitkan. Menaruhnya di runner publik tidak mengubah lisensinya, tetapi
#     membuat jaraknya jadi soal kebiasaan alih-alih soal berkas yang memang tidak ada di sini.
#
# JENDELA HARIAN, PENUH SEBULAN SEKALI
# Tiap hari yang ditarik 14 tanggal terakhir lewat `?tanggal=` — 14 permintaan kecil,
# ±1,3 MB. Tiap tanggal 1 ditarik SELURUH riwayat, 56 MB, dan hasilnya menimpa. Yang kedua
# bukan kemewahan: SP2KP menulis ulang angka lama (satu baris untuk Februari 2024 dibuat
# pada Februari 2026), dan penarik yang cuma menambah di ujung akan menyimpan angka yang
# sudah tidak diakui sumbernya sendiri. Alasan lengkapnya di kepala harga_data/tarik-sp2kp.mjs.
#
# APA YANG MENGHENTIKAN COMMIT, DAN APA YANG CUMA MELAPOR
# Yang MENGHENTIKAN: penjaga PII di penarik, dan `npm run check` — skema beserta aturan
# kebijakan. Data yang tidak lolos keduanya tidak boleh masuk repositori, apa pun alasannya.
# Yang MELAPOR SAJA: pencocokan angka dokumen. Angka di docs/16 dan docs/18 memang bergeser
# saat seri tumbuh; itu pekerjaan tangan manusia, bukan alasan menahan data yang benar.
# Hasilnya muncul di ringkasan job supaya tetap terbaca, bukan hilang jadi warna hijau.
#
# KOMENTAR HARGA — KREDENSIAL SENGAJA TIDAK DIWAJIBKAN
# `bangun-komentar-harga.mjs` menulis ulang komentar tiap kali FAKTA seri bergeser, dan pada
# seri harian itu berarti tiap hari kerja untuk tiap seri. Dengan ANTHROPIC_API_KEY terpasang
# itu ±44 panggilan model per hari; tanpanya, narasi disusun dari aturan dan rekamannya
# ditandai `terhitung`. Keduanya sah dan bedanya SELALU terbaca di berkasnya. Per 25 Agustus
# 2026 seluruh 51 komentar bersumber `terhitung`, jadi jalur tanpa kredensial tidak menurunkan
# apa pun. Kalau kelak jalur model diinginkan, cukup pasang secret ANTHROPIC_API_KEY — dan
# sadari bahwa ia lalu berjalan tiap hari, bukan sekali.
#
# TIGA HAL YANG PERLU DIKETAHUI TENTANG `schedule` DI GITHUB
#   1. Ia hanya berjalan dari cabang bawaan. Berkas ini tidak melakukan apa pun sampai ia
#      berada di `main`.
#   2. GitHub MEMATIKAN jadwal setelah 60 hari repositori tanpa aktivitas, dan commit dari
#      job ini sendiri tidak dihitung sebagai aktivitas untuk aturan itu.
#   3. Push memakai GITHUB_TOKEN TIDAK memicu workflow lain. Jadi commit harian dari sini
#      tidak membangun ulang situs — dan per 25 Agustus 2026 itu belum jadi soal, karena
#      jalur tayangnya sendiri (`situs.yml`) masih di cabang tema dan belum sampai ke main.
#      Begitu ia mendarat, situs tetap tidak akan terbangun dari commit ini, dan itu
#      disengaja: hostnya belum dipilih, dan jalur tayangnya diurus di sana, bukan diakali
#      dari sini.

name: harga

on:
  schedule:
    # 09.00 UTC = 16.00 WIB. SP2KP menerbitkan tanggal hari itu sekitar pukul 13 WIB;
    # menarik pukul 16 memberi jarak tiga jam tanpa menunggu sampai besok.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Jendela harian atau tarikan penuh
        type: choice
        options: [jendela, penuh]
        default: jendela
      jendela:
        description: Lebar jendela dalam hari (diabaikan bila mode penuh)
        default: '14'

concurrency:
  group: harga
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tarik:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: spec/package-lock.json

      - name: Pasang dependensi
        working-directory: spec
        run: npm ci

      # Tanggal 1 ditarik penuh, sisanya jendela. Tanggalnya dibaca menurut WIB, bukan UTC:
      # runner berjalan di UTC, dan zona yang berbeda dari datanya membuat "tanggal 1" jatuh
      # di hari yang salah tanpa satu pun galat.
      - name: Tentukan mode tarikan
        id: mode
        run: |
          hari=$(TZ=Asia/Jakarta date +%d)
          mode="${{ inputs.mode }}"
          if [ -z "$mode" ]; then
            if [ "$hari" = "01" ]; then mode=penuh; else mode=jendela; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode tarikan: $mode (tanggal $hari WIB)"

      - name: Tarik SP2KP
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "penuh" ]; then
            node harga_data/tarik-sp2kp.mjs --penuh
          else
            node harga_data/tarik-sp2kp.mjs --jendela "${{ inputs.jendela || '14' }}"
          fi

      - name: Bangun kosakata harga
        run: node spec/tools/bangun-harga.mjs --tulis

      # Tanpa kredensial ini menempuh jalur terhitung dan mengatakannya; lihat kepala berkas.
      - name: Tulis komentar harga
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node spec/tools/bangun-komentar-harga.mjs --tulis
          node spec/tools/periksa-komentar-harga.mjs --tulis

      # Gerbang yang MENAHAN. Kalau seri baru melanggar skema atau aturan kebijakan, tidak
      # ada yang di-commit — repositori tetap membawa data kemarin yang sah, bukan data hari
      # ini yang tidak.
      - name: Gerbang skema dan aturan
        working-directory: spec
        run: npm run check

      # Gerbang yang MELAPOR. Indeks dibangun karena pencocokan angka dokumen membacanya.
      - name: Angka dokumen — melapor, tidak menahan
        continue-on-error: true
        run: |
          node spec/tools/bangun-indeks.mjs --tulis > /dev/null
          node spec/tools/cek-angka-docs.mjs > angka.txt || echo BERGESER > angka-gagal
          tail -n 20 angka.txt

      - name: Commit bila ada yang berubah
        id: commit
        run: |
          # Lintasan disebut satu per satu. `git add -A` di repositori ini akan menyapu lapis
          # privat yang sengaja tidak pernah terbit; .gitignore memagarinya, dan daftar
          # eksplisit ini pagar keduanya.
          git add harga_data/sp2kp-hnt.ndjson harga_data/sp2kp-tarikan.json spec/vocab/harga
          if git diff --cached --quiet; then
            echo "berubah=tidak" >> "$GITHUB_OUTPUT"
            echo "Tidak ada yang berubah — SP2KP belum menerbitkan tanggal baru."
            exit 0
          fi
          tgl=$(node -p "require('./harga_data/sp2kp-tarikan.json').tanggalTerakhir")
          titik=$(node -p "require('./harga_data/sp2kp-tarikan.json').titik")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Harga SP2KP sampai ${tgl}: ${titik} titik, tarikan ${{ steps.mode.outputs.mode }}"
          # Kalau ada yang mendorong ke main sementara job ini berjalan, yang benar menaruh
          # commit data di ATASNYA, bukan menimpanya.
          git pull --rebase --autostash
          git push
          echo "berubah=ya" >> "$GITHUB_OUTPUT"

      - name: Ringkas hasil
        if: always()
        run: |
          {
            echo "### Tarikan harga — ${{ steps.mode.outputs.mode }}"
            echo
            if [ -f harga_data/sp2kp-tarikan.json ]; then
              echo "| | |"
              echo "|---|---|"
              echo "| Ditarik | $(node -p "require('./harga_data/sp2kp-tarikan.json').ditarik") |"
              echo "| Tanggal terakhir | $(node -p "require('./harga_data/sp2kp-tarikan.json').tanggalTerakhir") |"
              echo "| Varian | $(node -p "require('./harga_data/sp2kp-tarikan.json').varian") |"
              echo "| Titik harga | $(node -p "require('./harga_data/sp2kp-tarikan.json').titik") |"
              echo "| Di-commit | ${{ steps.commit.outputs.berubah || 'tidak sampai ke sana' }} |"
            fi
            if [ -f angka-gagal ]; then
              echo
              echo "#### Angka dokumen BERGESER — perlu tangan manusia"
              echo
              echo "Seri tumbuh sampai angka yang tersalin di docs/16 dan docs/18 tidak lagi cocok."
              echo "Datanya tetap di-commit; yang perlu diperbarui kalimat di dokumennya."
              echo
              echo '```'
              grep ' BEDA ' angka.txt || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
