<body>
    

<div class="content">
    <div class="image-login carousel slide" id="slide" data-ride="carousel">
        <!-- Indicators -->
        <ul class="carousel-indicators">
            <li data-target="#slide" data-slide-to="0" class="active"></li>
            <li data-target="#slide" data-slide-to="1"></li>
            <li data-target="#slide" data-slide-to="2"></li>
        </ul>

        <!-- The slideshow -->
        <div class="carousel-inner">
            <div class="carousel-item active">
                <div class="back-slide" style="position:relative">
                    <img src="https://cdn.rms-pi.com/rekan/img/Ellipse 1.png" style="position:absolute;top:0;left:0; width:75%" alt="Alternate Text" />
                    <img src="https://cdn.rms-pi.com/rekan/img/Ellipse 2.png" style="position:absolute;top:100px;left:0; width:25%" alt="Alternate Text" />
                </div>
                <div class="img-slide-container">
                    <img src="https://cdn.rms-pi.com/rekan/img/s1.png" class="img-slide" style="position:relative; margin: auto;" />
                </div>
            </div>
            <div class="carousel-item">
                <div class="img-slide-container">
                    <img src="https://cdn.rms-pi.com/rekan/img/s2.png" class="img-slide" style="position: relative; margin: auto; height: 100%; width: 100%; max-height: 100%" />
                </div>
            </div>
            <div class="carousel-item">
                <div class="img-slide-container">
                    <img src="https://cdn.rms-pi.com/rekan/img/s3.png" class="img-slide" style="position: relative; margin: auto; height: 100%; width: 100%; max-height: 100%" />
                </div>
            </div>
        </div>

        <!-- Left and right controls -->
        <a class="carousel-control-prev" href="#slide" data-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </a>
        <a class="carousel-control-next" href="#slide" data-slide="next">
            <span class="carousel-control-next-icon"></span>
        </a>
    </div>
    <div class="form-login">
        <form class="form-login-form" id="account" method="post">
            <div class="img-logo-container">
                <img src="https://cdn.rms-pi.com/rekan/img/logo-rms-new.png" class="logo-login" alt="" />
                <p class="subtitle">Selamat datang kembali</p>
            </div>
            <div class="input-group txt-user">
                <input type="text" class="form-control" placeholder="Masukan Username*" autocomplete="off" data-val="true" data-val-required="The UserName field is required." id="Input_UserName" name="Input.UserName" value="" />
            </div>
            <span class="text-danger field-validation-valid" data-valmsg-for="Input.UserName" data-valmsg-replace="true"></span>
            <div class="input-group txt-pass" style="margin-top: 20px">
                <input type="password" id="passwd" class="form-control" placeholder="Masukan Password*" autocomplete="new-password" data-val="true" data-val-required="The Password field is required." name="Input.Password" />
                <div class="input-group-append">
                    <span class="input-group-text" onclick="toogleVisible()"><i id="pin-icon" class="fas fa-eye"></i></span>
                </div>
            </div>
            <span class="text-danger field-validation-valid" data-valmsg-for="Input.Password" data-valmsg-replace="true"></span>
            <p class="forgot-password">
                Lupa Password ? Klik <a href=""><b>Disini</b></a>
            </p>
            <div class="text-danger validation-summary-valid" data-valmsg-summary="true"><ul><li style="display:none"></li>
</ul></div>
            <button type="submit" class="btn btn-block btn-login" style="margin-bottom: 20px">Masuk</button>
        <input name="__RequestVerificationToken" type="hidden" value="CfDJ8AnUfVN6vzFBiYHf6KeJrLR2ujHWlN9XSJp4f0B8n2DSqDoHsJVUjyvnrDCVBQ-5rO4TcTxqsZX-wCwAAcQpCVFzmbA-0voz3j2P_CRmI5nLCBmoxX67-ocKKbhYwFmGCQ-aJ7KiKfWJV6vKdzdn-gE" /></form>
    </div>
</div>
<script>
    function toogleVisible() {
        var x = document.getElementById("passwd");
        var y = document.getElementById("pin-icon");
        if (x.type === "password") {
            x.type = "text";
            y.classList.remove("fa-eye");
            y.classList.add("fa-eye-slash");
        } else {
            x.type = "password";
            y.classList.remove("fa-eye-slash");
            y.classList.add("fa-eye");
        }
    }
</script>
