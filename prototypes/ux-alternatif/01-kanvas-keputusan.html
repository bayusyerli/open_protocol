<!doctype html>
<html lang="id" data-konsep="kanvas">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Konsep 01 · Kanvas Lapangan — Pranatani</title>
<meta name="description" content="Prototipe UX: pintu masuk situasional. Satu perkara lapangan, satu keputusan per layar, sampai jawaban atau penolakan menjawab.">
<style>
/* =========================================================================
   KONSEP 01 · KANVAS LAPANGAN
   Rupa: instrumen lapangan. Sudut siku, garis tebal, tanpa bayang lembut.
   Hijau rumah Pranatani DIPAKAI TERBATAS — hanya untuk jejak langkah yang
   sudah dilalui. Warna putusan memakai amber bakar supaya tetap terbaca di
   bawah matahari, dan tiap keadaan dibedakan BENTUK juga, bukan cuma warna.
   Tanpa berkas luar, tanpa font unduhan, tanpa localStorage.
   ========================================================================= */

:root {
  color-scheme: light;
  --kertas:      #f4f1e8;
  --kanvas:      #e6e2d5;
  --panel:       #fffdf7;
  --tinta:       #16201b;
  --lemah:       #55605a;
  --garis:       #16201b;
  --garis-tipis: #c2bcab;
  --sorot:       #9c4508;   /* putusan aktif */
  --sorot-latar: #fbe9d8;
  --jalan:       #0b6b4f;   /* jejak yang sudah dilalui — hijau rumah */
  --jalan-latar: #dfeee7;
  --waspada:     #8a1c1c;
  --waspada-latar:#fae4e1;
  --henti:       #3a3f52;
  --henti-latar: #e4e5ec;
  --di-sorot:    #ffffff;
  --sentuh: 48px;
  --tepi: 3px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="terang"]) {
    color-scheme: dark;
    --kertas:      #101512;
    --kanvas:      #080b09;
    --panel:       #182019;
    --tinta:       #eef3ec;
    --lemah:       #a4b0a8;
    --garis:       #eef3ec;
    --garis-tipis: #3b4740;
    --sorot:       #ffb267;
    --sorot-latar: #3a2410;
    --jalan:       #6fd7ae;
    --jalan-latar: #143229;
    --waspada:     #ff9d92;
    --waspada-latar:#3d1a17;
    --henti:       #b9bed3;
    --henti-latar: #232734;
    --di-sorot:    #10150f;
  }
}
:root[data-tema="gelap"] {
  color-scheme: dark;
  --kertas:#101512; --kanvas:#080b09; --panel:#182019; --tinta:#eef3ec;
  --lemah:#a4b0a8; --garis:#eef3ec; --garis-tipis:#3b4740;
  --sorot:#ffb267; --sorot-latar:#3a2410; --jalan:#6fd7ae; --jalan-latar:#143229;
  --waspada:#ff9d92; --waspada-latar:#3d1a17; --henti:#b9bed3; --henti-latar:#232734;
  --di-sorot:#10150f;
}

*,*::before,*::after { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  background: var(--kanvas);
  color: var(--tinta);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}
@media (min-width: 768px) { body { font-size: 18px; } }

:where(a, button, input, select, [tabindex]):focus-visible {
  outline: 3px solid var(--sorot);
  outline-offset: 2px;
  border-radius: 2px;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.001ms !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
}

.lewati {
  position:absolute; left:-9999px; top:0; z-index:60;
  background: var(--sorot); color: var(--di-sorot); padding:12px 16px; font-weight:700;
}
.lewati:focus { left:8px; top:8px; }

/* ---------- rangka instrumen ---------- */
.alat {
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  /* Kolomnya minmax(0,1fr), bukan 1fr. Butir grid berbawaan `min-width:auto`,
     jadi tabel merek yang lebar akan MELEBARKAN kolomnya alih-alih menggulir di
     dalam `.tabel-bungkus` — dan halaman ikut menggulir mendatar. */
  grid-template-columns: minmax(0, 1fr);
  max-width: 1180px;
  margin: 0 auto;
  background: var(--kertas);
  border-left: var(--tepi) solid var(--garis);
  border-right: var(--tepi) solid var(--garis);
}
@media (max-width: 719px) { .alat { border-left:0; border-right:0; } }

/* ---------- kepala: merek + rel langkah ---------- */
.kepala {
  min-width: 0;
  border-bottom: var(--tepi) solid var(--garis);
  background: var(--panel);
  position: sticky; top: 0; z-index: 20;
}
.baris-merek {
  display:flex; align-items:center; gap:12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--garis-tipis);
}
.merek-h1 { margin:0; font:inherit; font-weight:inherit; min-width:0; }
.merek { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; min-height:44px; }
.merek svg { display:block; flex:none; }
.merek b { font-size:1.06rem; letter-spacing:.01em; display:block; line-height:1.1; }
.merek small { font-size:.66rem; letter-spacing:.16em; text-transform:uppercase; color:var(--lemah); display:block; }
.baris-merek .kanan { margin-left:auto; display:flex; align-items:center; gap:8px; }

.tandaproto {
  font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; font-weight:800;
  border:2px solid var(--garis); padding:4px 7px; white-space:nowrap;
}
.tombol-kecil {
  min-height:44px; min-width:44px; padding:0 12px;
  background:transparent; border:2px solid var(--garis); color:var(--tinta);
  font:inherit; font-size:.8rem; font-weight:700; cursor:pointer;
}
.tombol-kecil:hover { background: var(--sorot-latar); }

/* rel langkah */
.rel { min-width:0; display:flex; align-items:stretch; overflow-x:auto; scrollbar-width:thin; }
.rel::-webkit-scrollbar { height:4px; }
.rel-btn {
  flex:none; display:flex; align-items:center; gap:8px;
  min-height:44px; padding:8px 12px;
  background:transparent; border:0; border-right:1px solid var(--garis-tipis);
  font:inherit; font-size:.8rem; font-weight:700; color:var(--lemah);
  cursor:pointer; text-align:left; white-space:nowrap;
}
.rel-btn[data-keadaan="lalu"] { color:var(--jalan); background:var(--jalan-latar); cursor:pointer; }
.rel-btn[data-keadaan="kini"] { color:var(--sorot); background:var(--sorot-latar); box-shadow: inset 0 -4px 0 var(--sorot); cursor:default; }
.rel-btn[disabled] { cursor:default; }
.rel-btn i { font-style:normal; font-variant-numeric:tabular-nums; font-size:.72rem;
  border:2px solid currentColor; width:22px; height:22px; display:grid; place-items:center; flex:none; }
.rel-btn[data-keadaan="lalu"] i::after { content:"✓"; }
.rel-btn[data-keadaan="lalu"] i span { display:none; }

/* ---------- badan ---------- */
.badan { min-width: 0; padding: 18px 14px 30px; }
@media (min-width: 720px) { .badan { padding: 26px 30px 44px; } }

.mata { font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; font-weight:800; color:var(--sorot); margin:0 0 8px; }
h1 { font-size: clamp(1.5rem, 5.2vw, 2.1rem); line-height:1.15; margin:0 0 8px; letter-spacing:-.015em; }
h2 { font-size: clamp(1.35rem, 4.6vw, 1.8rem); line-height:1.18; margin:0 0 8px; letter-spacing:-.012em; }
h3 { font-size: 1.02rem; margin: 20px 0 8px; }
p { margin: 0 0 12px; max-width: 62ch; }
.lede { font-size: 1.02rem; color: var(--lemah); }

/* ---------- pilihan besar (satu keputusan per layar) ---------- */
.pilihan { display:grid; gap:12px; margin: 18px 0 0; padding:0; list-style:none; }
@media (min-width: 860px) { .pilihan.dua { grid-template-columns: 1fr 1fr; } }
.pil {
  display:flex; align-items:flex-start; gap:14px; width:100%; text-align:left;
  min-height: 64px; padding: 16px 16px 16px 13px;
  background: var(--panel); color: var(--tinta);
  border: 2px solid var(--garis); border-left: 7px solid var(--garis);
  font: inherit; cursor: pointer;
  transition: background .12s ease, border-color .12s ease, transform .12s ease;
}
.pil:hover { background: var(--sorot-latar); border-left-color: var(--sorot); }
.pil:active { transform: translateY(1px); }
.pil .isi { min-width:0; }
.pil strong { display:block; font-size:1.08rem; line-height:1.25; }
.pil small { display:block; margin-top:5px; color:var(--lemah); font-size:.86rem; line-height:1.4; }
.pil .tanda { flex:none; width:34px; height:34px; display:grid; place-items:center; border:2px solid currentColor; color:var(--sorot); }
.pil .tanda svg { display:block; }

/* ---------- pita putusan: bentuk berbeda per keadaan ---------- */
.pita { border:var(--tepi) solid var(--garis); margin: 0 0 18px; background: var(--panel); }
.pita-kepala { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0;
  padding:12px 14px; border-bottom:2px solid var(--garis);
  font-size:1.05rem; line-height:1.3; letter-spacing:0; font-weight:800; }
.pita-kepala .lencana {
  font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
  padding:5px 9px; border:2px solid currentColor; white-space:nowrap;
}
.pita-isi { padding: 14px; }

.pita[data-hasil="ada"]      { border-color: var(--jalan); }
.pita[data-hasil="ada"] .pita-kepala { background: var(--jalan-latar); color: var(--jalan); border-bottom-color: var(--jalan); }
/* ragu: garis miring — beda BENTUK, bukan cuma warna */
.pita[data-hasil="ragu"]     { border-color: var(--sorot); }
.pita[data-hasil="ragu"] .pita-kepala {
  color: var(--sorot); border-bottom-color: var(--sorot);
  background: repeating-linear-gradient(135deg, var(--sorot-latar) 0 9px, transparent 9px 18px);
}
/* henti: bingkai ganda tebal */
.pita[data-hasil="henti"]    { border-color: var(--henti); box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 6px var(--henti); }
.pita[data-hasil="henti"] .pita-kepala { background: var(--henti-latar); color: var(--henti); border-bottom-color: var(--henti); }
.pita[data-hasil="awas"]     { border-color: var(--waspada); }
.pita[data-hasil="awas"] .pita-kepala { background: var(--waspada-latar); color: var(--waspada); border-bottom-color: var(--waspada); }

/* ---------- uji pembanding ---------- */
.uji { border:2px dashed var(--sorot); background: var(--sorot-latar); padding:14px; margin: 16px 0; }
.uji h3 { margin:0 0 6px; font-size:.98rem; color:var(--sorot); }
.uji p { margin:0; color:var(--tinta); }

/* ---------- daftar fakta ---------- */
.fakta { display:grid; gap:0; margin:14px 0; border-top:2px solid var(--garis); }
.fakta > div { display:grid; grid-template-columns: 1fr auto; gap:10px; align-items:baseline;
  padding:9px 2px; border-bottom:1px solid var(--garis-tipis); }
.fakta dt, .fakta .k { color:var(--lemah); font-size:.88rem; margin:0; }
.fakta dd, .fakta .v { margin:0; font-weight:800; font-variant-numeric: tabular-nums; text-align:right; }
.fakta .v.nol { color: var(--henti); }

/* ---------- kartu bahan ---------- */
.bahan-daftar { display:grid; gap:10px; margin:14px 0; padding:0; list-style:none; }
/* Butir grid berbawaan `min-width:auto` dan menolak menyusut di bawah lebar
   isinya. Tanpa baris ini, tabel merek melebarkan <li>-nya sampai halaman ikut
   menggulir mendatar — persis yang `.tabel-bungkus` seharusnya cegah. */
.bahan-daftar > li, .bahan, .bahan-isi { min-width: 0; }
.pilihan > * { min-width: 0; }
.fakta > div { min-width: 0; }
.fakta .v { min-width: 0; overflow-wrap: anywhere; }
.bahan {
  border:2px solid var(--garis); background:var(--panel);
}
.bahan > summary {
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 14px; min-height:56px; cursor:pointer; font-weight:700; list-style:none;
}
.bahan > summary::-webkit-details-marker { display:none; }
.bahan > summary::after { content:"▸"; margin-left:auto; font-size:1.1rem; color:var(--sorot); }
.bahan[open] > summary::after { content:"▾"; }
.bahan[open] > summary { border-bottom:2px solid var(--garis); background:var(--sorot-latar); }
.bahan .kadar { font-variant-numeric:tabular-nums; color:var(--lemah); font-weight:600; }
.bahan .irac { font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; border:2px solid var(--sorot); color:var(--sorot); padding:3px 6px; font-weight:800; }
.bahan .cacah { font-size:.8rem; color:var(--lemah); font-weight:600; }
.bahan-isi { padding: 12px 14px 14px; }

table.merek { width:100%; border-collapse:collapse; font-size:.88rem; }
table.merek th, table.merek td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--garis-tipis); vertical-align:top; }
table.merek th { font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--lemah); border-bottom:2px solid var(--garis); }
table.merek td.nomor, table.merek td.dosis { font-variant-numeric:tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.82rem; }
table.merek td.dosis[data-lain="ya"] { color: var(--waspada); font-weight:700; }
.tabel-bungkus { min-width:0; max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }

/* ---------- batas jawaban: DI DALAM ISI, bukan di kaki ---------- */
.batas { border:var(--tepi) solid var(--garis); background:var(--panel); margin: 22px 0 0; }
.batas > h3 { margin:0; padding:12px 14px; border-bottom:2px solid var(--garis); background:var(--henti-latar); color:var(--henti); font-size:.82rem; letter-spacing:.1em; text-transform:uppercase; }
.batas-isi { padding: 12px 14px; }
.sumber { display:grid; grid-template-columns:auto 1fr; gap:10px; padding:10px 0; border-bottom:1px solid var(--garis-tipis); }
.sumber:last-child { border-bottom:0; }
.tingkat {
  width:34px; height:34px; display:grid; place-items:center; font-weight:800; font-size:1rem;
  border:2px solid var(--garis);
}
.tingkat[data-t="B"] { background: var(--jalan-latar); color: var(--jalan); border-color: var(--jalan); }
.tingkat[data-t="D"] { background: var(--sorot-latar); color: var(--sorot); border-color: var(--sorot); }
.tingkat[data-t="?"] { background: var(--henti-latar); color: var(--henti); border-color: var(--henti);
  background-image: repeating-linear-gradient(135deg, transparent 0 5px, rgb(0 0 0 / 7%) 5px 10px); }
.sumber b { display:block; font-size:.94rem; }
.sumber span { display:block; font-size:.82rem; color:var(--lemah); }
.sumber em { display:block; font-size:.82rem; font-style:normal; margin-top:4px; }

/* ---------- catatan / penolakan ---------- */
.catatan { border-left:6px solid var(--henti); background:var(--henti-latar); padding:12px 14px; margin:14px 0; }
.catatan.awas { border-left-color: var(--waspada); background: var(--waspada-latar); }
.catatan p:last-child { margin-bottom:0; }
.catatan strong { color: inherit; }

/* ---------- kalkulator ---------- */
.borang { display:grid; gap:14px; margin:18px 0; }
.medan { display:grid; gap:6px; }
.medan label { font-weight:700; font-size:.92rem; }
.medan small { color:var(--lemah); font-size:.82rem; }
.medan input, .medan select {
  min-height: var(--sentuh); padding: 10px 12px; font: inherit; font-size:1.05rem;
  background: var(--panel); color: var(--tinta); border: 2px solid var(--garis); border-radius:0;
  font-variant-numeric: tabular-nums; width:100%;
}
.hasil-hitung { border:var(--tepi) solid var(--jalan); background:var(--jalan-latar); padding:14px; }
.hasil-hitung .angka { font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight:800; line-height:1.05; font-variant-numeric:tabular-nums; color:var(--jalan); }
.hasil-hitung .satuan { font-size:1rem; font-weight:700; color:var(--jalan); }

/* ---------- kaki: bilah status ---------- */
.kaki {
  min-width: 0;
  border-top: var(--tepi) solid var(--garis); background: var(--panel);
  position: sticky; bottom: 0; z-index: 20;
}
.status { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 14px; font-size:.78rem; }
.status .jar { display:inline-flex; align-items:center; gap:7px; font-weight:700; }
.status .jar i { width:10px; height:10px; background:var(--jalan); display:block; flex:none; }
.status .jar[data-luring="ya"] i { background:var(--sorot); }
.status .asal { color:var(--lemah); min-width:0; }
.status .asal b { color: var(--tinta); }
.aksi-kaki { display:flex; gap:8px; padding:0 14px 10px; }
.tombol-kembali {
  flex:1; min-height:var(--sentuh); padding:0 14px;
  background:var(--panel); color:var(--tinta); border:2px solid var(--garis);
  font:inherit; font-weight:800; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
}
.tombol-kembali:hover { background: var(--kanvas); }
.tombol-kembali[hidden] { display:none; }
.tombol-mulai { flex:1; min-height:var(--sentuh); background:var(--sorot); color:var(--di-sorot); border:2px solid var(--sorot); font:inherit; font-weight:800; cursor:pointer; }

.khusus-pembaca {
  position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.grid-dua { display:grid; gap:14px; }
@media (min-width: 860px) { .grid-dua { grid-template-columns: 1fr 1fr; align-items:start; } }
.kandidat { border:2px solid var(--garis); background:var(--panel); padding:14px; }
.kandidat h3 { margin:0 0 4px; font-size:1.05rem; }
.kandidat .ilmiah { font-style:italic; color:var(--lemah); font-size:.88rem; margin:0 0 8px; }
</style>
</head>

<a class="lewati" href="#konten">Lewati ke isi</a>

<div class="alat">

  <header class="kepala">
    <div class="baris-merek">
      <h1 class="merek-h1"><a class="merek" href="index.html">
        <svg viewBox="0 0 512 512" width="30" height="30" role="img" aria-label="Pranatani">
          <!-- Disalin sebaris dari app/ikon.svg supaya prototipe tetap utuh lewat file://
               maupun kalau berkasnya dipindahkan. Kalau markahnya berubah di sana, ubah di sini juga. -->
          <rect width="512" height="512" rx="112" fill="#00442f"/>
          <g transform="translate(84 84) scale(1.34)" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M54 220V52h79c43 0 72 25 72 62s-29 62-72 62H94" stroke="#fffef8" stroke-width="26"/>
            <path d="M94 77h45" stroke="#54c7a6" stroke-width="15"/>
            <path d="M94 109h64" stroke="#54c7a6" stroke-width="15"/>
            <path d="M94 141h45" stroke="#54c7a6" stroke-width="15"/>
            <path d="M165 111c0-29 20-49 48-49 0 28-20 49-48 49Z" fill="#79d20a" stroke="#79d20a" stroke-width="8"/>
            <path d="M165 111 196 80" stroke="#00442f" stroke-width="8"/>
          </g>
        </svg>
        <span><b>Pranatani</b><small>Kanvas Lapangan</small></span>
      </a></h1>
      <span class="kanan">
        <span class="tandaproto">Prototipe UX 01</span>
        <button class="tombol-kecil" type="button" id="tombolTema" aria-live="polite">Gelap</button>
      </span>
    </div>
    <nav class="rel" id="rel" aria-label="Langkah yang sudah dilalui"></nav>
  </header>

  <main class="badan" id="konten" tabindex="-1">
    <div id="layar" aria-live="polite"></div>
  </main>

  <footer class="kaki">
    <p class="status">
      <span class="jar" id="jar"><i></i><span id="jarTeks">Memeriksa jaringan</span></span>
      <span class="asal" id="asal">Sumber layar ini: <b>belum ada</b></span>
    </p>
    <div class="aksi-kaki">
      <button class="tombol-kembali" type="button" id="kembali" hidden>← Kembali satu langkah</button>
      <button class="tombol-kembali" type="button" id="ulang" hidden>Mulai perkara baru</button>
    </div>
  </footer>

</div>

<script>
"use strict";
/* =========================================================================
   DATA — disalin dari indeks turunan repositori (spec/indeks/, dibangun
   19–23 Agustus 2026). Tidak ada angka, nomor pendaftaran, atau nama merek
   yang dikarang. Yang disederhanakan untuk prototipe diberi tanda sendiri.
   ========================================================================= */

const OPT = {
  trips: {
    id: "op:pst:00000001", nama: "Trips", ilmiah: "Thrips parvispinus", jenis: "Serangga",
    gejala: "Daun muda mengeriting ke ATAS seperti mangkuk, dan permukaan bawahnya keperakan atau kecoklatan seperti tergores halus. Bunga dan tunas rontok sebelum jadi buah; tanaman kerdil dan pucuknya mengumpul.",
    diCabai: { produk: 246, zat: 60, kartu: 159, berlarangan: 39 }
  },

const el  = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n   = (x) => (x ?? 0).toLocaleString('id-ID');

/* ---------- komponen bersama ---------- */

function blokBatas(kunci, tidakAda, ekstra) {
  const s = kunci.map((k) => {
    const x = SUMBER[k];
    return `<div class="sumber">
      <span class="tingkat" data-t="${esc(x.t)}" aria-hidden="true">${x.t === '?' ? '–' : esc(x.t)}</span>
      <span>
        <b>${esc(x.nama)}</b>
        <span>${x.t === '?' ? 'tingkat bukti belum ditetapkan' : 'tingkat bukti ' + esc(x.t)} · ${esc(x.meta)}</span>
        <em>${esc(x.alasan)}</em>
      </span>
    </div>`;
  }).join('');
  const gaps = (tidakAda || []).map((k) => `<li>${esc(TIDAK_ADA[k])}</li>`).join('');
  return `<section class="batas" aria-labelledby="jbatas">
    <h3 id="jbatas">Batas jawaban di layar ini</h3>
    <div class="batas-isi">
      ${s}
      ${gaps ? `<h3 style="margin-top:14px">Yang tidak diketahui, dan karena itu tidak ditebak</h3><ul style="margin:0;padding-left:20px">${gaps}</ul>` : ''}
      ${ekstra || ''}
    </div>
  </section>`;
}

function ikonPil(d) {
  return `<span class="tanda" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${d}</svg></span>`;
}

/* ---------- rel langkah ---------- */
function gambarRel() {
  const r = el('rel');
  if (!jejak.length) { r.innerHTML = ''; return; }
  r.innerHTML = jejak.map((j, i) => {
    const kini = i === jejak.length - 1;
    return `<button class="rel-btn" type="button" data-keadaan="${kini ? 'kini' : 'lalu'}"
      data-ke="${i}" ${kini ? 'disabled aria-current="step"' : ''}>
      <i aria-hidden="true"><span>${i + 1}</span></i>${esc(j.judul)}</button>`;
  }).join('');
  r.querySelectorAll('[data-ke]').forEach((b) => b.addEventListener('click', () => {
    const i = Number(b.dataset.ke);
    jejak = jejak.slice(0, i);
    const j = jejak.pop();
    buka(j.layar, j.judul);
  }));
  r.scrollLeft = r.scrollWidth;
}

/* ---------- navigasi ---------- */
function buka(nama, judul) {
  jejak.push({ layar: nama, judul });
  const f = LAYAR[nama];
  el('layar').innerHTML = f();
  gambarRel();
  el('kembali').hidden = jejak.length < 2;
  el('ulang').hidden   = jejak.length < 2;
  el('asal').innerHTML = 'Sumber layar ini: <b>' + esc(f.asal || 'tidak ada — layar pilihan') + '</b>';
  el('konten').focus();
  window.scrollTo({ top: 0, behavior: 'auto' });
  pasangAksi();
}

function pasangAksi() {
  document.querySelectorAll('[data-buka]').forEach((b) => {
    b.addEventListener('click', () => buka(b.dataset.buka, b.dataset.judul || b.textContent.trim().slice(0, 22)));
  });
  const t = el('tangki'), d = el('dosisPilih');
  if (t && d) {
    const hitung = () => {
      negara.tangki = parseFloat(String(t.value).replace(',', '.')) || 0;
      negara.dosis = d.value;
      const dv = parseFloat(String(d.value).replace(',', '.')) || 0;
      const ml = negara.tangki * dv;
      el('hasilTangki').textContent = ml ? ml.toLocaleString('id-ID', { maximumFractionDigits: 1 }) : '—';
      el('hasilTutup').textContent = ml ? Math.round(ml / 10).toLocaleString('id-ID') : '—';
    };
    t.addEventListener('input', hitung); d.addEventListener('change', hitung); hitung();
  }
  const hp = el('hargaP');
  if (hp) {
    const hitungHara = () => {
      const rows = document.querySelectorAll('[data-npk]');
      let out = '';
      rows.forEach((r) => {
        const inp = r.querySelector('input');
        const harga = parseFloat(String(inp.value).replace(/[^0-9.]/g, '')) || 0;
        const [N, P, K] = r.dataset.npk.split('-').map(Number);
        const karung = 50;
        const kgHara = karung * (N + P + K) / 100;
        const rp = kgHara > 0 && harga > 0 ? harga / kgHara : 0;
        r.querySelector('.rp').textContent = rp ? 'Rp ' + Math.round(rp).toLocaleString('id-ID') + ' / kg hara' : '—';
      });
      return out;
    };
    document.querySelectorAll('[data-npk] input').forEach((i) => i.addEventListener('input', hitungHara));
    hitungHara();
  }
}

                angka di label botol itu, bukan angka botol tetangganya.</p>
                <p>⚠ <strong>RUTIN 18 EC didaftarkan dalam 1 l/ha</strong>, satuan yang berbeda
                sama sekali. Tanpa volume semprot per hektare, angka itu tidak bisa dibandingkan
                dengan yang ml/l — dan volume semprot tidak ada di registri.</p>

            ` : `<p>Daftar mereknya ada di indeks; di prototipe ini yang dibuka lengkap baru kelompok teratas.

      <h3>Isinya</h3>
      <ul class="bahan-daftar">
        ${LARBAN.isi.map((i) => `<li><details class="bahan"><summary>
          <span>${esc(i.z)}</span><span class="kadar">${esc(i.v)}</span>
          <span class="irac">IRAC ${esc(i.irac)}</span>
          ${i.larangan ? `<span class="irac" style="border-color:var(--waspada);color:var(--waspada)">berlarangan</span>` : ''}
        </summary><div class="bahan-isi">
          ${i.larangan ? `<p><strong>Klorpirifos dilarang pada lingkup tertentu</strong>, bukan dilarang seluruhnya.</p>
            <div class="fakta"><div><span class="k">Lingkup larangan</span><span class="v">${esc(LARBAN.larangan.lingkup.join(' · '))}</span></div>
            <div><span class="k">Dasar</span><span class="v" style="font-size:.82rem;text-align:right">${esc(LARBAN.larangan.instrumen)}<br>${esc(LARBAN.larangan.kutipan)}</span></div></div>
            <p>Produk ini <strong>tetap terdaftar untuk Cabai</strong>. Halaman ini menampilkan
            larangan beserta lingkup dan pasalnya, lalu berhenti — ia tidak menyimpulkan legal
            atau ilegal untuk keadaanmu.</p>`
          : `<p>Tidak ada larangan lingkup yang tercatat untuk bahan ini.</p>`}
        </div></details></li>`).join('')}
      </ul>

      <div class="catatan">
        <p><strong>Kedua bahannya bergolongan berbeda</strong> — IRAC 1B dan IRAC 3A. Golongan
        dipakai untuk menata rotasi; pemetaan nama→kode di sini dicocokkan lewat ejaan dan
        berstatus draft, jadi perlakukan sebagai petunjuk, bukan putusan.</p>
      </div>

      <h3>Penggunaan berlabel yang tercatat</h3>
      <div class="tabel-bungkus">
        <table class="merek">
          <thead><tr><th scope="col">Komoditas</th><th scope="col">Sasaran</th><th scope="col">Dosis terdaftar</th><th scope="col">Tenggang panen</th></tr></thead>
          <tbody>${LARBAN.guna.map((g) => `<tr><td>${esc(g.k)}</td><td>${esc(g.o)}</td>
            <td class="dosis">${esc(g.ds)}</td>
            <td style="color:var(--waspada);font-weight:700">tidak dicatat</td></tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="catatan awas">
        <p><strong>Kolom terakhir kosong di seluruh registri.</strong> ${esc(TIDAK_ADA.phi)}</p>
      </div>
    </div>
  </section>
  ${blokBatas(['pestisida', 'golongan'], ['phi', 'namaDagang'])}
`;
LAYAR.hasilLarban.asal = 'registri pestisida + daftar larangan Permentan 43/2019';

LAYAR.hasilTakCocok = () => `
  <section class="pita" data-hasil="henti">
    <h2 class="pita-kepala"><span class="lencana">Berhenti di sini</span> Tidak ada yang cocok</h2>
    <div class="pita-isi">
      <p><strong>Tidak ketemu bukan bukti produknya tidak terdaftar.</strong> Yang dicocokkan
      layar ini nama <em>terdaftar</em>, dan nama itu sering berbeda dari nama jualan di
      kemasan. Pemetaan antara keduanya belum ada.</p>

      <div class="catatan awas">
        <p><strong>Yang sengaja tidak ditawarkan: nama yang paling mirip.</strong> Menawarkan
        “mungkin maksudmu …” di layar seperti ini adalah cara paling halus menanam karangan
        sebagai fakta — orang membaca tebakan mesin sebagai konfirmasi, lalu membeli barang
        yang bukan itu.</p>
      </div>

      <h3>Yang bisa dicoba, dengan hasil yang bisa diperiksa sendiri</h3>
      <p>Cocokkan lewat <strong>isinya</strong>, bukan namanya. Angka komposisi tercetak di
      kemasan — “NPK 15-15-15”, “Abamektin 18 g/L” — dan angka itu memang yang disimpan
      registri.</p>

      <div class="pilihan">
        <button class="pil" type="button" data-buka="pegang" data-judul="Coba lagi">
          ${ikonPil(IK.balik)}
          <span class="isi"><strong>Coba nama lain</strong><small>Kembali ke daftar contoh</small></span>
        </button>
      </div>
    </div>
  </section>
  ${blokBatas(['pestisida', 'pupuk'], ['namaDagang'])}
`;
LAYAR.hasilTakCocok.asal = 'registri pupuk + pestisida — 0 rekaman cocok';

/* --- 3. takaran --- */
LAYAR.semprot = () => `
  <p class="mata">Aritmetika, bukan anjuran</p>
  <h2>Dosis di label jadi isi tangki</h2>
  <p class="lede">Angka yang keluar adalah hasil perkalian dari angka yang kamu masukkan
  sendiri. Halaman ini tidak memilihkan dosis, dan tidak tahu berapa yang benar untuk kebunmu.</p>

  <div class="borang">
    <div class="medan">
      <label for="dosisPilih">Dosis yang tertulis di label botolmu</label>
      <small>Daftar ini memuat dosis terdaftar sungguhan dari merek Abamektin 18 g/L. Kalau botolmu
      lain, pakai angka yang tertulis di botol itu.</small>
      <select id="dosisPilih">
        <option value="0,5">0,5 ml per liter — DEMOLISH / PHOSCORMITE / STADIUM 18 EC</option>
        <option value="0,75">0,75 ml per liter — DIMECTIN / MECTIMAX 18 EC</option>
        <option value="1">1 ml per liter — TSUBAME / MATROS / ABATEN 18 EC</option>
        <option value="1,5">1,5 ml per liter — SUPEMEC / DKMEKTIN / OPTIMECT 18 EC</option>
        <option value="2">2 ml per liter — batas atas STARMEK 18 EC (1–2 ml/l)</option>
      </select>
    </div>
    <div class="medan">
      <label for="tangki">Isi tangki semprotmu, dalam liter</label>
      <small>Tangki gendong yang lazim 14–16 liter. Ukur sekali dengan botol air mineral kalau ragu.</small>
      <input id="tangki" type="number" inputmode="decimal" min="1" max="200" step="0.5" value="15">
    </div>
  </div>

  <div class="hasil-hitung">
    <p style="margin:0 0 4px;font-weight:700;color:var(--jalan)">Yang dituang ke satu tangki penuh</p>
    <p style="margin:0"><span class="angka" id="hasilTangki">—</span> <span class="satuan">mililiter</span></p>
    <p style="margin:8px 0 0;font-size:.92rem">Kira-kira <strong><span id="hasilTutup">—</span></strong>
    tutup botol air mineral, kalau satu tutup dihitung 10&nbsp;ml.</p>
  </div>

  <div class="catatan awas">
    <p><strong>Tutup botol bukan alat ukur.</strong> Angka 10&nbsp;ml itu perkiraan lazim; tutup
    yang berbeda merek berbeda isinya. Kalau selisih 20% berarti, pakai gelas ukur.</p>
    <p><strong>Dan satu hal yang tidak bisa dijawab layar mana pun di sini:</strong>
    ${esc(TIDAK_ADA.phi)}</p>
  </div>
  ${blokBatas(['pestisida'], ['phi'])}
`;
LAYAR.semprot.asal = 'dosis terdaftar dari registri; sisanya masukanmu sendiri';

/* --- 4. biaya --- */
LAYAR.biaya = () => {
  const baris = [
    { n: 'PHONSKA', d: '01.01.2022.1248', npk: '15-8-10' },
    { n: 'PHONSKA', d: '01.01.2022.1252', npk: '15-15-10' },
    { n: 'PHONSKA', d: '01.01.2024.261',  npk: '10-10-10' }
  ];
  return `
  <p class="mata">Aritmetika, bukan anjuran</p>
  <h2>Rupiah per kilogram hara, bukan per karung</h2>
  <p class="lede">Tiga rekaman di bawah sama-sama bernama PHONSKA dan sama-sama sungguhan.
  Kandungannya berbeda, jadi karung yang harganya sama tidak berarti haranya sama.</p>

  <div class="borang">
    ${baris.map((b, i) => `
      <div class="medan" data-npk="${b.npk}">
        <label for="h${i}">${esc(b.n)} — NPK ${esc(b.npk)} <span style="font-weight:400;color:var(--lemah);font-size:.84rem">· ${esc(b.d)}</span></label>
        <small>Harga satu karung 50&nbsp;kg di tempatmu</small>
        <input id="h${i}" type="number" inputmode="numeric" min="0" step="1000" placeholder="misal 250000" value="${250000 + i * 15000}">
        <p class="rp" style="margin:2px 0 0;font-weight:800;font-variant-numeric:tabular-nums;color:var(--jalan)">—</p>
      </div>`).join('')}
    <input type="hidden" id="hargaP" value="1">
  </div>

  <div class="catatan awas">
    <p><strong>Tiga hal yang tidak boleh dibandingkan begini.</strong></p>
    <p>1 · <strong>Pupuk cair terhadap pupuk padat.</strong> ${esc(TIDAK_ADA.beratJenis)}
    PHONSKA CAIR karena itu tidak masuk daftar di atas.</p>
    <p>2 · <strong>Hara terhadap hara yang berbeda.</strong> Perhitungan di atas menjumlahkan
    N, P₂O₅, dan K₂O jadi satu angka “kg hara”. Itu memudahkan pembanding harga, tetapi
    <em>tidak</em> berarti satu kilogram N sama gunanya dengan satu kilogram K₂O bagi tanaman.</p>
    <p>3 · <strong>Sediaan buatan sendiri.</strong> Kadar hara kompos dan pupuk organik cair
    tidak diketahui sebelum batchnya diuji, dan berbeda tiap tumpukan. Karena itu resep
    terbuka muncul <em>tanpa angka</em> di sini, bukan dengan angka taksiran.</p>
  </div>

  <div class="catatan">
    <p><strong>Angka rupiahnya tidak datang dari mana-mana kecuali dari kamu.</strong>
    ${esc(TIDAK_ADA.harga)} Harga eceran nasional yang diterbitkan pemerintah pun mendaftarkan
    Urea, NPK 15-15-15, SP-36, dan ZA <em>tanpa mengisi angkanya</em>.</p>
  </div>
  ${blokBatas(['pupuk'], ['harga', 'beratJenis'])}
  `;
};
LAYAR.biaya.asal = 'komposisi dari registri pupuk; harga masukanmu sendiri';

/* ---------- pasang ---------- */
el('kembali').addEventListener('click', () => {
  if (jejak.length < 2) return;
  jejak.pop(); const j = jejak.pop();
  buka(j.layar, j.judul);
});
el('ulang').addEventListener('click', () => { jejak = []; buka('mulai', 'Mulai'); });

el('tombolTema').addEventListener('click', () => {
  const r = document.documentElement;
  const gelapSistem = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const kini = r.dataset.tema || (gelapSistem ? 'gelap' : 'terang');
  const baru = kini === 'gelap' ? 'terang' : 'gelap';
  r.dataset.tema = baru;                       /* hanya di memori — tidak ditulis ke mana pun */
  el('tombolTema').textContent = baru === 'gelap' ? 'Terang' : 'Gelap';
});

function jaringan() {
  const j = el('jar'), t = el('jarTeks');
  if (navigator.onLine) { j.dataset.luring = 'tidak'; t.textContent = 'Ada sinyal'; }
  else { j.dataset.luring = 'ya'; t.textContent = 'Tanpa sinyal — layar ini tetap jalan'; }
}
addEventListener('online', jaringan); addEventListener('offline', jaringan); jaringan();

buka('mulai', 'Mulai');
</script>
</body>
</html>
