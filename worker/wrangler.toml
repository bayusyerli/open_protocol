# Worker yang melayani situs dari R2. Alasannya di kepala situs.js.
#
#   npx wrangler deploy --config worker/wrangler.toml
#
# Bucket-nya TIDAK dibuat berkas ini; ia dibuat sekali dengan
#   npx wrangler r2 bucket create pranatani-situs
# lalu isinya disinkronkan CI. Memisahkan keduanya disengaja: yang sering berubah isinya,
# dan pembuatan bucket yang dijalankan tiap deploy adalah operasi yang menunggu untuk gagal
# pada hari seseorang salah ketik namanya.

name = "pranatani-situs"
main = "situs.js"
compatibility_date = "2026-08-01"

# Nol permintaan ke Worker saat tidak ada yang membuka situs — dan itu yang membuat
# tagihannya benar-benar nol pada trafik awal.
workers_dev = false

[[r2_buckets]]
binding = "SITUS"
bucket_name = "pranatani-situs"

# Zona pranatani.com aktif sejak 30 Agustus 2026 — nameserver-nya berpindah dari Rumahweb
# ke bonnie/justin.ns.cloudflare.com, dan sejak itu rute di bawah bisa dipasang. Sebelum
# tanggal itu blok ini dikomentari, sebab deploy gagal selama zonanya belum ada.
#
# DUA POLA, bukan satu. `www` diproksi sama seperti apex, dan rute dipasang per pola host:
# tanpa baris keduanya, www.pranatani.com melewati Worker sepenuhnya dan jatuh ke origin
# placeholder 192.0.2.1 — 522, selamanya. Worker sendiri yang mengalihkannya ke apex.
[[routes]]
pattern = "pranatani.com/*"
zone_name = "pranatani.com"

[[routes]]
pattern = "www.pranatani.com/*"
zone_name = "pranatani.com"
